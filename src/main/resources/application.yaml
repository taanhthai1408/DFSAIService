spring:
  application:
    name: springAI

  # =========================================================
  # PostgreSQL DataSource (dùng cho PgVectorStore)
  # =========================================================
  datasource:
    url: jdbc:postgresql://10.30.1.200:5432/postgres
    username: postgres
    password: postgresql
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      # Ollama server URL
      base-url: http://103.163.216.181:11434

      # Chat configuration
      chat:
        enabled: true
        model: llama3
        options:
          temperature: 0.7       # 0.0 = deterministic, 1.0 = creative
          top-p: 0.9
          top-k: 40
          num-predict: 2048      # max tokens to generate
          num-ctx: 4096          # context window size

      # Embedding configuration
      embedding:
        enabled: true
        model: llama3            # dùng llama3 cho embedding (hoặc nomic-embed-text nếu có)

    # =========================================================
    # PgVector Store Configuration
    # =========================================================
    vectorstore:
      pgvector:
        index-type: NONE                  # llama3 có 4096 dims, vượt giới hạn HNSW/IVFFlat (max 2000)
                                           # Dùng NONE = exact search, OK cho dataset vừa phải
                                           # Nếu muốn HNSW: đổi model sang nomic-embed-text (768 dims)
        distance-type: COSINE_DISTANCE   # Cosine similarity (phù hợp với text embedding)
        dimensions: 4096                 # llama3 embedding dimension (4096)
        initialize-schema: true          # Tự động tạo bảng vector_store nếu chưa có
        schema-name: public
        table-name: vector_store

# Server config
server:
  port: 8080

# Logging để debug Spring AI
logging:
  level:
    org.springframework.ai: DEBUG
    com.test.springAI: DEBUG
